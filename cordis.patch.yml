# dsh-game-adventure 的 bundle patch。
#
# 这一行把本包的 main 入口（src/index.js）作为 host 半边加载——它是一个普通的
# Cordis 插件，跑在 DSH 宿主进程里，负责安静地记录，并把记录以只读路由交给界面。
#
# 浏览器半边不需要在这里声明：package.json 的 "dsh.client" 字段告诉 web app
# 去加载本包的 "./client" 入口（src/client.js）。
#
# 0.0.1 骨架阶段：host 半边还没有接上任何记录来源，这条路由只会返回空列表。
# 界面在这种情况下显示「还没有什么可回望的。」——空就是空，不塞假数据。

- insert:
    - id: dsh-game-adventure
      name: dsh-game-adventure
